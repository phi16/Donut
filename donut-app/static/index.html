<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Donut</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: #282828; }

      /* Scrollbar — Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
      }
      *:hover {
        scrollbar-color: #555 transparent;
      }
      /* Scrollbar — Chrome / Edge / Safari */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 4px;
        transition: background 0.3s;
      }
      *:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
      *:hover::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
      ::-webkit-scrollbar-corner { background: transparent; }

      #app-root {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      /* --- Left: Canvas --- */
      #panel-canvas {
        flex: 1 1 0%;
        min-width: 100px;
        position: relative;
        background: rgb(40, 40, 40);
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* --- Resize handles --- */
      .resize-handle {
        width: 6px;
        cursor: col-resize;
        background: #333;
        flex-shrink: 0;
        transition: background 0.15s;
      }
      .resize-handle:hover, .resize-handle.active {
        background: #555;
      }

      /* --- Middle: Output --- */
      #panel-output {
        flex: 1 1 0%;
        min-width: 120px;
        background: rgba(30, 30, 30, 0.95);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #output-top {
        display: flex;
        flex-direction: column;
        flex: 1 1 0;
        min-height: 80px;
        overflow: hidden;
      }
      #entry-select {
        margin: 8px;
        padding: 8px;
        background: #2d2d2d;
        color: #d4d4d4;
        border: 1px solid #444;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 14px;
        outline: none;
        flex-shrink: 0;
      }
      /* --- Settings popup --- */
      #settings-btn {
        position: fixed;
        bottom: 16px;
        left: 16px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: #555;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: color 0.2s;
        line-height: 1;
        padding: 0;
      }
      #settings-btn:hover {
        color: #999;
      }
      #settings-popup {
        display: none;
        position: fixed;
        bottom: 54px;
        left: 16px;
        background: rgba(38, 38, 38, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        padding: 8px 14px;
        z-index: 100;
        min-width: 130px;
      }
      #settings-popup.visible {
        display: block;
      }
      #settings-popup label {
        display: block;
        color: #999;
        font-family: 'Noto Sans Mono', 'Consolas', 'Monaco', monospace;
        font-size: 12px;
        cursor: pointer;
        padding: 3px 0;
        user-select: none;
        transition: color 0.15s;
      }
      #settings-popup label:hover {
        color: #bbb;
      }
      #settings-popup .settings-title {
        color: #ccc;
        font-family: 'Noto Sans Mono', 'Consolas', 'Monaco', monospace;
        font-size: 13px;
        font-weight: bold;
        padding-bottom: 6px;
        margin-bottom: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      #settings-popup .settings-info {
        color: #666;
        font-family: 'Noto Sans Mono', 'Consolas', 'Monaco', monospace;
        font-size: 11px;
        padding-top: 6px;
        margin-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      #eval-result {
        margin: 0 8px 4px 8px;
        padding: 8px;
        color: #aaa;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 13px;
        white-space: pre-wrap;
        line-height: 1.4;
        overflow-y: auto;
        flex: 1 1 0;
      }
      #eval-result.evaluable {
        color: #e0e0e0;
      }

      /* --- Output vertical resize handle --- */
      #handle-output-v {
        height: 6px;
        cursor: row-resize;
        background: #333;
        flex-shrink: 0;
        transition: background 0.15s;
        display: none;
      }
      #handle-output-v.visible {
        display: block;
      }
      #handle-output-v:hover, #handle-output-v.active {
        background: #555;
      }

      /* --- Shader viewport (bottom of middle column) --- */
      #shader-viewport {
        display: none;
        flex-direction: column;
        flex: 1 1 0;
        min-height: 100px;
      }
      #shader-viewport.visible {
        display: flex;
      }
      #shader-viewport-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        flex-shrink: 0;
      }
      #shader-viewport-bar button {
        background: #3a3a3a;
        color: #ccc;
        border: 1px solid #555;
        padding: 2px 8px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 11px;
        cursor: pointer;
        border-radius: 2px;
      }
      #shader-viewport-bar button:hover {
        background: #4a4a4a;
      }
      #shader-viewport-info {
        color: #777;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 11px;
        user-select: none;
      }
      #shader-canvas-wrap {
        flex: 1 1 0;
        position: relative;
        overflow: hidden;
        cursor: grab;
      }
      #shader-canvas-wrap.dragging {
        cursor: grabbing;
      }
      #shader-canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* --- Right: Code editor --- */
      #panel-editor {
        flex: 1 1 0%;
        min-width: 150px;
        background: rgba(30, 30, 30, 0.95);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #code-editor-cm {
        flex: 1 1 0;
        overflow: auto;
      }
      #code-editor-cm .cm-editor {
        height: 100%;
      }
      #diagnostics {
        margin: 0;
        padding: 8px;
        color: #f88;
        background: rgba(255, 60, 60, 0.1);
        border-top: 2px solid #f44;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 12px;
        white-space: pre-line;
        line-height: 1.4;
        max-height: 150px;
        overflow-y: auto;
        display: none;
        flex-shrink: 0;
      }
      #diagnostics.has-errors {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app-root">
      <!-- Left: Canvas -->
      <div id="panel-canvas">
        <canvas id="canvas"></canvas>
      </div>

      <!-- Resize handle 1 -->
      <div class="resize-handle" id="handle-left"></div>

      <!-- Middle: Output -->
      <div id="panel-output">
        <div id="output-top">
          <select id="entry-select"></select>
          <div id="eval-result"></div>
        </div>
        <div id="handle-output-v"></div>
        <div id="shader-viewport">
          <div id="shader-viewport-bar">
            <button id="shader-reset">Reset</button>
            <span id="shader-viewport-info"></span>
          </div>
          <div id="shader-canvas-wrap">
            <canvas id="shader-canvas"></canvas>
          </div>
        </div>
      </div>

      <!-- Resize handle 2 -->
      <div class="resize-handle" id="handle-right"></div>

      <!-- Right: Code editor -->
      <div id="panel-editor">
        <div id="code-editor-cm"></div>
        <div id="diagnostics"></div>
      </div>
    </div>
    <button id="settings-btn" title="Settings">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/>
      </svg>
    </button>
    <div id="settings-popup">
      <div class="settings-title">Donut</div>
      <label><input type="checkbox" id="shader-toggle" checked> Shader</label>
      <label><input type="checkbox" id="vim-toggle"> Vim</label>
      <div class="settings-info">donut-app v0.1</div>
    </div>
    <script src="index.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Donut</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; background: #282828; }

      /* Scrollbar — Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
      }
      *:hover {
        scrollbar-color: #555 transparent;
      }
      /* Scrollbar — Chrome / Edge / Safari */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 4px;
        transition: background 0.3s;
      }
      *:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
      *:hover::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
      ::-webkit-scrollbar-corner { background: transparent; }

      #app-root {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      /* --- Left: Canvas --- */
      #panel-canvas {
        flex: 1 1 0%;
        min-width: 100px;
        position: relative;
        background: rgb(40, 40, 40);
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* --- Resize handles --- */
      .resize-handle {
        width: 6px;
        cursor: col-resize;
        background: #333;
        flex-shrink: 0;
        transition: background 0.15s;
      }
      .resize-handle:hover, .resize-handle.active {
        background: #555;
      }

      /* --- Middle: Output --- */
      #panel-output {
        flex: 1 1 0%;
        min-width: 120px;
        background: rgba(30, 30, 30, 0.95);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #output-top {
        display: flex;
        flex-direction: column;
        flex: 1 1 0;
        min-height: 80px;
        overflow: hidden;
      }
      #entry-select {
        margin: 8px;
        padding: 8px;
        background: #2d2d2d;
        color: #d4d4d4;
        border: 1px solid #444;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 14px;
        outline: none;
        flex-shrink: 0;
      }
      .toggle-row {
        margin: 0 8px 4px 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .toggle-row label {
        color: #888;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 12px;
        cursor: pointer;
      }
      #eval-result {
        margin: 0 8px 4px 8px;
        padding: 8px;
        color: #aaa;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 13px;
        white-space: pre-wrap;
        line-height: 1.4;
        overflow-y: auto;
        flex: 1 1 0;
      }
      #eval-result.evaluable {
        color: #e0e0e0;
      }

      /* --- Output vertical resize handle --- */
      #handle-output-v {
        height: 6px;
        cursor: row-resize;
        background: #333;
        flex-shrink: 0;
        transition: background 0.15s;
        display: none;
      }
      #handle-output-v.visible {
        display: block;
      }
      #handle-output-v:hover, #handle-output-v.active {
        background: #555;
      }

      /* --- Shader viewport (bottom of middle column) --- */
      #shader-viewport {
        display: none;
        flex-direction: column;
        flex: 1 1 0;
        min-height: 100px;
      }
      #shader-viewport.visible {
        display: flex;
      }
      #shader-viewport-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        flex-shrink: 0;
      }
      #shader-viewport-bar button {
        background: #3a3a3a;
        color: #ccc;
        border: 1px solid #555;
        padding: 2px 8px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 11px;
        cursor: pointer;
        border-radius: 2px;
      }
      #shader-viewport-bar button:hover {
        background: #4a4a4a;
      }
      #shader-viewport-info {
        color: #777;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 11px;
        user-select: none;
      }
      #shader-canvas-wrap {
        flex: 1 1 0;
        position: relative;
        overflow: hidden;
        cursor: grab;
      }
      #shader-canvas-wrap.dragging {
        cursor: grabbing;
      }
      #shader-canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* --- Right: Code editor --- */
      #panel-editor {
        flex: 1 1 0%;
        min-width: 150px;
        background: rgba(30, 30, 30, 0.95);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #code-editor-cm {
        flex: 1 1 0;
        overflow: auto;
      }
      #code-editor-cm .cm-editor {
        height: 100%;
      }
      #diagnostics {
        margin: 0;
        padding: 8px;
        color: #f88;
        background: rgba(255, 60, 60, 0.1);
        border-top: 2px solid #f44;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 12px;
        white-space: pre-line;
        line-height: 1.4;
        max-height: 150px;
        overflow-y: auto;
        display: none;
        flex-shrink: 0;
      }
      #diagnostics.has-errors {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app-root">
      <!-- Left: Canvas -->
      <div id="panel-canvas">
        <canvas id="canvas"></canvas>
      </div>

      <!-- Resize handle 1 -->
      <div class="resize-handle" id="handle-left"></div>

      <!-- Middle: Output -->
      <div id="panel-output">
        <div id="output-top">
          <select id="entry-select"></select>
          <div class="toggle-row">
            <label><input type="checkbox" id="glsl-toggle"> GLSL</label>
            <label><input type="checkbox" id="shader-toggle" checked> Shader</label>
          </div>
          <div id="eval-result"></div>
        </div>
        <div id="handle-output-v"></div>
        <div id="shader-viewport">
          <div id="shader-viewport-bar">
            <button id="shader-reset">Reset</button>
            <span id="shader-viewport-info"></span>
          </div>
          <div id="shader-canvas-wrap">
            <canvas id="shader-canvas"></canvas>
          </div>
        </div>
      </div>

      <!-- Resize handle 2 -->
      <div class="resize-handle" id="handle-right"></div>

      <!-- Right: Code editor -->
      <div id="panel-editor">
        <div id="code-editor-cm"></div>
        <div id="diagnostics"></div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>

[package]
name = "donut-app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
wasm-logger = "0.2.0"
donut-analysis = { path = "../crates/donut-analysis" }
donut-core = { path = "../crates/donut-core" }
donut-lang = { path = "../crates/donut-lang" }
donut-layout = { path = "../crates/donut-layout" }
donut-renderer = { path = "../crates/donut-renderer" }
donut-runtime = { path = "../crates/donut-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
log = "0.4.29"
js-sys = "0.3.82"

[dependencies.web-sys]
version = "0.3.82"
features = [
    "console",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "Window",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlSelectElement",
    "HtmlOptionElement",
    "HtmlTextAreaElement",
    "MouseEvent",
    "KeyboardEvent",
    "DomTokenList",
    "WebGlRenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation",
]
